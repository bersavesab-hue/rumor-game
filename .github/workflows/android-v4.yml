name: Build Android APK v4

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'game_project_v4*.zip'
      - '.github/workflows/android-v4.yml'

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.2"
  GODOT_STATUS: "stable"
  GODOT_TEMPLATE_DIR: "4.7.2.stable"
  APK_NAME: "whosaidit-v0.2.0-debug.apk"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Extract v4 Godot project
        shell: bash
        run: |
          set -euxo pipefail
          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'game_project_v4*.zip' | sort | tail -n 1)"
          test -n "$ZIP_FILE"
          echo "Using $ZIP_FILE"
          rm -rf godot_project
          mkdir -p godot_project
          unzip -q "$ZIP_FILE" -d godot_project
          test -f godot_project/project.godot
          test -f godot_project/export_presets.cfg

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "build-tools;35.0.1" \
            "platforms;android-35"

      - name: Download Godot
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/godot"
          curl -fL --retry 4 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip" \
            -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d "$HOME/godot"
          chmod +x "$HOME/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64"
          echo "GODOT_BIN=$HOME/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" >> "$GITHUB_ENV"

      - name: Install export templates
        shell: bash
        run: |
          set -euxo pipefail
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_DIR}"
          mkdir -p "$TEMPLATE_DIR"
          curl -fL --retry 4 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz" \
            -o /tmp/templates.tpz
          rm -rf /tmp/templates
          mkdir -p /tmp/templates
          unzip -q /tmp/templates.tpz -d /tmp/templates
          cp -a /tmp/templates/templates/. "$TEMPLATE_DIR/"
          test -f "$TEMPLATE_DIR/android_debug.apk"

      - name: Create debug keystore
        shell: bash
        run: |
          set -euxo pipefail
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Rumor Game,C=US"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Configure Android paths
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF2
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF2

      - name: Import project and validate scripts
        shell: bash
        run: |
          set -o pipefail
          mkdir -p godot_project/build
          "$GODOT_BIN" --headless --path godot_project --import --quit 2>&1 | tee godot_project/build/import.log
          if grep -Eq "SCRIPT ERROR: (Parse Error|Compile Error)|Failed to load script" godot_project/build/import.log; then
            echo "GDScript error detected"
            exit 1
          fi

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          "$GODOT_BIN" \
            --headless \
            --path godot_project \
            --export-debug Android \
            "build/$APK_NAME" 2>&1 | tee godot_project/build/export.log
          test -s "godot_project/build/$APK_NAME"
          sha256sum "godot_project/build/$APK_NAME" > godot_project/build/SHA256SUMS.txt
          ls -lh godot_project/build/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rumor-game-android-v0.2.0
          path: |
            godot_project/build/${{ env.APK_NAME }}
            godot_project/build/SHA256SUMS.txt
            godot_project/build/import.log
            godot_project/build/export.log
          if-no-files-found: error
          retention-days: 30
