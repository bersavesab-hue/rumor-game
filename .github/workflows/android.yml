name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.2"
  GODOT_STATUS: "stable"
  GODOT_TEMPLATE_DIR: "4.7.2.stable"
  APK_NAME: "whosaidit-v0.1.0-debug.apk"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Find and extract game project
        shell: bash
        run: |
          set -euxo pipefail

          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'game_project*.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "找不到 game_project ZIP"
            exit 1
          fi

          echo "Using: $ZIP_FILE"

          mkdir -p godot_project
          unzip -q "$ZIP_FILE" -d godot_project

          test -f godot_project/project.godot
          test -f godot_project/export_presets.cfg

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -euxo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "build-tools;35.0.1" \
            "platforms;android-35"

      - name: Download Godot
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$HOME/godot"

          curl -fL --retry 4 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip" \
            -o /tmp/godot.zip

          unzip -q /tmp/godot.zip -d "$HOME/godot"

          chmod +x "$HOME/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64"

          echo "GODOT_BIN=$HOME/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" >> "$GITHUB_ENV"

      - name: Install export templates
        shell: bash
        run: |
          set -euxo pipefail

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_DIR}"

          mkdir -p "$TEMPLATE_DIR"

          curl -fL --retry 4 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz" \
            -o /tmp/templates.tpz

          mkdir -p /tmp/templates
          unzip -q /tmp/templates.tpz -d /tmp/templates

          cp -a /tmp/templates/templates/. "$TEMPLATE_DIR/"

          test -f "$TEMPLATE_DIR/android_debug.apk"

      - name: Create debug keystore
        shell: bash
        run: |
          set -euxo pipefail

          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Rumor Game,C=US"

          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Configure Android paths
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Import project
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p godot_project/build

          "$GODOT_BIN" \
            --headless \
            --path godot_project \
            --import \
            --quit

      - name: Build APK
        shell: bash
        run: |
          set -euxo pipefail

          "$GODOT_BIN" \
            --headless \
            --path godot_project \
            --export-debug Android \
            "godot_project/build/$APK_NAME"

          test -s "godot_project/build/$APK_NAME"

          ls -lh godot_project/build/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rumor-game-android-v0.1.0
          path: godot_project/build/*.apk
          if-no-files-found: error
          retention-days: 30
